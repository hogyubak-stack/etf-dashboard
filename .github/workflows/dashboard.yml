name: Update ETF Dashboard

on:
  schedule:
    # 한국 시간(KST = UTC+9) 기준 평일(월~금) 자동 실행 (주말 제외)
    - cron: '0 23 * * 0-4'   # 평일 아침 08:00 KST (UTC 일~목 23:00)
    - cron: '0 4 * * 1-5'    # 평일 오후 13:00 KST (UTC 월~금 04:00)
    - cron: '30 11 * * 1-5'  # 평일 저녁 20:30 KST (UTC 월~금 11:30)
  workflow_dispatch:         # GitHub 웹페이지에서 수동 즉시 실행 버튼 활성화

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 한글 폰트 설치 (PNG 이미지 한글 깨짐 방지)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum fonts-noto-cjk fontconfig
          fc-cache -fv

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 필수 패키지 설치
        run: |
          pip install --upgrade pip
          pip install finance-datareader pandas requests google-api-python-client google-auth-httplib2 google-auth-oauthlib pillow

      - name: ETF 대시보드 생성 및 Google Drive 업로드 (HTML + PNG)
        env:
          GDRIVE_CREDENTIALS_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python etf_dashboard.py --once --no-open
